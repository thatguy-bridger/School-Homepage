name: Update Calendar File

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate ICS File
        run: node Resources/bruh/generate.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # This is the magic change: path is set to '.'
      # It grabs your HTML page, the newly generated .ics file, 
      # and any other assets, deploying them all together.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
